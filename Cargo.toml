# ============================================================================
# File: Cargo.toml
# Location: snap-coin-pool/Cargo.toml
# Version: 0.3.0
#
# CHANGELOG (v0.3.0):
#   - Add WebSocket stats server dependencies:
#       * axum - Web framework for HTTP + WebSocket
#       * tower-http - CORS and static file serving
#       * tokio-tungstenite - WebSocket protocol
#   - No changes to existing dependencies
# ============================================================================

[package]
name = "snap-coin-pool"
version = "0.3.0"
edition = "2024"

[dependencies]
# Error handling
anyhow = "1.0"

# Configuration (.env + environment variables)
dotenvy = "0.15"
envy = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Crypto / math
num-bigint = "0.4"

# Snap Coin core library
snap-coin = "11.2.2"

# Async runtime
tokio = { version = "1.49", features = ["full"] }

# Persistence
sled = "0.34"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }

# WebSocket stats server
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tokio-tungstenite = "0.24"

[profile.release]
debug = true

